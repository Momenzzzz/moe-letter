<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habeba 💗</title>
<style>
:root{--bg:#fff0f5;--card:#ffffff;--ink:#4a1630;--pink:#ff4d8d;--soft:#ffd0e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1e;--card:#3b1a2c;--ink:#ffe4ef;--soft:#5a2740}}
:root[data-theme="dark"]{--bg:#2a0f1e;--card:#3b1a2c;--ink:#ffe4ef;--soft:#5a2740}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;overflow-x:hidden}
.wrap{max-width:460px;margin:0 auto;padding:24px 18px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.step{display:none;animation:in .5s}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:2rem;margin:.2em 0}
.big{font-size:4rem;margin:0}
p{font-size:1.1rem;line-height:1.7}
button{font:inherit;font-size:1.15rem;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;background:var(--pink);color:#fff;margin:6px;transition:transform .2s}
button:active{transform:scale(.95)}
#no{background:var(--soft);color:var(--ink)}
.card{background:var(--card);border-radius:22px;padding:34px 20px;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 8px 24px rgba(255,77,141,.2);cursor:pointer}
.bar{height:22px;border-radius:99px;background:var(--soft);overflow:hidden;margin:20px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8ab5,var(--pink))}
input{font:inherit;font-size:1.1rem;padding:12px 16px;border-radius:999px;border:2px solid var(--soft);background:var(--card);color:var(--ink);text-align:center;width:70%}
.letter{background:var(--card);border-radius:22px;padding:24px;text-align:start;box-shadow:0 8px 24px rgba(255,77,141,.2);white-space:pre-line}
.heart{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;animation:fall 3s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3}}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="wrap">

<section class="step on" id="s1">
  <p class="big">🥺</p>
  <h1 data-k="title"></h1>
  <p data-k="q"></p>
  <button id="yes" data-k="yes"></button>
  <button id="no" data-k="no"></button>
</section>

<section class="step" id="s2">
  <p class="big">💘</p>
  <h1 data-k="scanT"></h1>
  <div class="bar"><i id="fill"></i></div>
  <p id="pct">0%</p>
  <p id="scanMsg"></p>
  <button id="scan" data-k="scan"></button>
  <button id="next2" data-k="next" style="display:none"></button>
</section>

<section class="step" id="s3">
  <h1 data-k="reasonsT"></h1>
  <div class="card" id="card"></div>
  <p id="cnt"></p>
  <button id="next3" data-k="next" style="display:none"></button>
</section>

<section class="step" id="s4">
  <p class="big">🔒</p>
  <h1 data-k="lockT"></h1>
  <p data-k="hint"></p>
  <input id="pw" type="text" autocomplete="off">
  <br><button id="open" data-k="open"></button>
  <p id="err"></p>
</section>

<section class="step" id="s5">
  <p class="big">💌</p>
  <div class="letter" id="letter"></div>
  <p data-k="end"></p>
</section>

</div>
<script>
// ✏️ EDIT THESE: password, reasons, and the letter text
var PASS="katkoot";
var T={
en:{
 title:"Habeba 💗",q:"Do you like me?",yes:"Yes 💖",no:"No",
 nos:["Are you sure?","Think again 🥺","I'll tell your mom 😤","Last chance!","Okay fine 😭"],
 scanT:"Love Meter",scan:"Start scan",next:"Next ➡️",
 scanning:"Analyzing Elktkoot…",done:"Result: ∞% ⚠️ Error: too much love!",
 reasonsT:"Reasons I love you",tap:"Tap for the next reason",
 reasons:["Your smile fixes my whole day 😊","Your presence brings comfort and joy","Even when you're mad at me you're cute","Your expressions, the way you speak, your clothes, everything about you is beautiful","Because you're Habeba, and there's no one like you"],
 lockT:"One last surprise",hint:"Enter the password to open the letter (hint: what i call you 😉)",open:"Open",wrong:"Nope, try again 😏",
 letter:"To Habeba,\n\nI don’t know what to say except that you’re the best thing that ever happened to me.\nFrom the moment our eyes met, my heart knew that you were someone special. your smile illuminates every room you enter, you have shown me the true meaning of devotion. understanding, and unconditional support.\n Thank you for being here, and for putting up with me.\nIn your eyes i see a reflection of a future filled with endless possibilties, We can conquer any obstacle and create a story that will be remembered for all time\nYou are my inspiration, my muse, and the reason my heart beats with such fervor.\nI promise to cherish you, protect you \n\nMomen 💗",
 end:"Screenshot this and send it to me 😌"}
};
var L="en",tries=0,ri=0;
var $=function(i){return document.getElementById(i)};
function go(n){document.querySelectorAll(".step").forEach(function(s){s.classList.remove("on")});$("s"+n).classList.add("on")}
function render(){
 document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=T[L][e.dataset.k]});
 $("letter").textContent=T[L].letter;
 $("cnt").textContent=ri?(ri+"/"+T[L].reasons.length):T[L].tap;
 $("card").textContent=ri?T[L].reasons[ri-1]:"💗";
 if(tries>0&&$("no").style.display!="none")$("no").textContent=T[L].nos[Math.min(tries-1,T[L].nos.length-1)];
}
function hearts(){
 for(var i=0;i<30;i++){var h=document.createElement("span");h.className="heart";h.textContent=["💖","💗","💕","✨"][i%4];
 h.style.left=Math.random()*100+"vw";h.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(h);
 setTimeout(function(x){x.remove()},4500,h)}
}
// Step 1: runaway No
function dodge(e){
 if(e)e.preventDefault();
 tries++;var b=$("no");
 if(tries>=6){b.style.display="none";return}
 b.style.position="fixed";
 b.style.left=Math.random()*(innerWidth-110)+"px";
 b.style.top=Math.random()*(innerHeight-60)+"px";
 b.style.transform="scale("+Math.max(.5,1-tries*.1)+")";
 $("yes").style.transform="scale("+(1+tries*.25)+")";
 $("yes").style.margin=(6+tries*6)+"px";
 render();
}
$("no").addEventListener("mouseenter",dodge);
$("no").addEventListener("touchstart",dodge,{passive:false});
$("no").addEventListener("click",dodge);
$("yes").onclick=function(){hearts();setTimeout(function(){go(2)},900)};
// Step 2: love meter
$("scan").onclick=function(){
 $("scan").style.display="none";$("scanMsg").textContent=T[L].scanning;
 var p=0,t=setInterval(function(){
  p+=2;$("fill").style.width=Math.min(p,100)+"%";$("pct").textContent=p+"%";
  if(p>=100){clearInterval(t);$("pct").textContent="1000%";$("scanMsg").textContent=T[L].done;hearts();$("next2").style.display=""}
 },40)};
$("next2").onclick=function(){go(3)};
// Step 3: reasons
$("card").onclick=function(){
 if(ri<T[L].reasons.length)ri++;
 render();
 if(ri>=T[L].reasons.length)$("next3").style.display=""};
$("next3").onclick=function(){go(4)};
// Step 4: password
function tryPw(){
 if($("pw").value.trim().toLowerCase()==PASS.toLowerCase()){hearts();go(5)}
 else{$("err").textContent=T[L].wrong;$("pw").classList.remove("shake");void $("pw").offsetWidth;$("pw").classList.add("shake")}
}
$("open").onclick=tryPw;
$("pw").addEventListener("keydown",function(e){if(e.key=="Enter")tryPw()});
render();
</script>
</body>
</html>
